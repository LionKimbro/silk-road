[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silk-road"
version = "0.1.0"
description = "Filesystem-native Silk Road waystation and Sherpa control panel."
requires-python = ">=3.10"
dependencies = [
  "lionscliapp",
]

[project.scripts]
silk-road = "silkroad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
